name: Deploy to Google Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: ai-workflow-platform
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check GCP credentials
        id: check-gcp
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ] || [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "::warning::GCP credentials not configured. Skipping deployment."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        if: steps.check-gcp.outputs.skip != 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.check-gcp.outputs.skip != 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        if: steps.check-gcp.outputs.skip != 'true'
        run: gcloud auth configure-docker

      - name: Build and push Docker image
        if: steps.check-gcp.outputs.skip != 'true'
        run: |
          docker build -t gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} .
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }}

      - name: Deploy to Cloud Run
        if: steps.check-gcp.outputs.skip != 'true'
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10
        continue-on-error: true

      - name: Get deployed URL
        if: steps.check-gcp.outputs.skip != 'true'
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --format 'value(status.url)') || true
          if [ -n "$URL" ]; then
            echo "Deployed to: $URL"
            echo "DEPLOY_URL=$URL" >> $GITHUB_OUTPUT
          fi

      - name: Skip notice
        if: steps.check-gcp.outputs.skip == 'true'
        run: echo "GCP deployment skipped - GCP_SA_KEY and GCP_PROJECT_ID secrets not configured."
